<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0d1319" media="(prefers-color-scheme: dark)">

<style>body{padding-top:env(safe-area-inset-top,0px);margin:0}html body #app{height:calc(100dvh - env(safe-area-inset-top,0px));min-height:0}</style></head><body>
<style>
/* Layout: Bibliothek als Liste, Üben als Einzelbildschirm: Noten oben, Steuerung, Klaviatur unten */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface2: #e3e8ee; --ink: #15202b; --muted: #5a6876; --line: #cdd5dd;
  --accent: #1f5fc8; --accent-ink: #ffffff; --hand-r: #1f5fc8; --hand-l: #c9750c; --ok: #17935a; --bad: #d03a3a;
  --key-w: #fbfcfd; --key-w2: #dfe5eb; --key-b: #18212b; --lane: rgba(21, 32, 43, .045); --falls-bg: #f5f7fa; --cursor: rgba(31, 95, 200, .13); --shadow: 0 1px 2px rgba(10, 20, 30, .12), 0 6px 18px rgba(10, 20, 30, .08);
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-title: "Fraunces", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1319; --surface: #151d26; --surface2: #202b36; --ink: #e8eef3; --muted: #92a1af; --line: #2b3844;
    --accent: #6aa5ff; --accent-ink: #08131f; --hand-r: #6aa5ff; --hand-l: #f2a844; --ok: #3ec47f; --bad: #ff7272;
    --key-w: #e8edf1; --key-w2: #b9c3cc; --key-b: #0a0f14; --lane: rgba(255, 255, 255, .035); --falls-bg: #0f161e; --cursor: rgba(106, 165, 255, .16); --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1319; --surface: #151d26; --surface2: #202b36; --ink: #e8eef3; --muted: #92a1af; --line: #2b3844;
  --accent: #6aa5ff; --accent-ink: #08131f; --hand-r: #6aa5ff; --hand-l: #f2a844; --ok: #3ec47f; --bad: #ff7272;
  --key-w: #e8edf1; --key-w2: #b9c3cc; --key-b: #0a0f14; --lane: rgba(255, 255, 255, .035); --falls-bg: #0f161e; --cursor: rgba(106, 165, 255, .16); --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-ui); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { height: max(600px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))); display: flex; flex-direction: column; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1100px; margin: 0 auto; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* Kopfzeile */
.bar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; font: 600 20px/1.15 var(--f-title); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); }
.ibtn:hover { background: var(--surface2); }
.ibtn svg { width: 22px; height: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; }

/* Bibliothek */
.lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px; }
.lib-head h1 { margin: 0; font: 600 30px/1.1 var(--f-title); letter-spacing: -.02em; }
.lib-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.pieces { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); padding-bottom: 16px; }
.piece { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; width: 100%; box-shadow: var(--shadow); }
.piece:hover { border-color: var(--accent); }
.thumb { width: 64px; height: 80px; flex: none; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb svg { width: 28px; height: 28px; }
.piece .meta { min-width: 0; flex: 1; }
.piece .t { font: 600 17px/1.2 var(--f-title); overflow-wrap: anywhere; }
.piece .s { color: var(--muted); font-size: 13px; margin-top: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.chip.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--hand-l) 18%, transparent); color: var(--hand-l); }

/* Übungsbildschirm */
.sheet { flex: 1; min-height: 120px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--surface); align-items: center; }
.tab { border: 0; border-radius: 9px; padding: 6px 12px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; min-height: 34px; }
.tab[aria-selected="true"] { background: var(--surface2); color: var(--ink); }
.tabs .sp { flex: 1; }
.panes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane { flex: 1; min-height: 0; position: relative; overflow: auto; -webkit-overflow-scrolling: touch; }
.pane + .pane { border-top: 2px solid var(--line); }
.score-wrap { position: relative; color: var(--ink); }
.score-wrap svg { display: block; }
.cursor { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--cursor); border-radius: 6px; transition: transform .12s ease-out, height .12s; will-change: transform; }
.mhit.loop { fill: var(--accent); fill-opacity: .12; }
.mhit.miss { fill: var(--bad); fill-opacity: .1; }
.ev.R.cur *[stroke]:not([stroke="none"]) { stroke: var(--hand-r); }
.ev.R.cur *[fill]:not([fill="none"]) { fill: var(--hand-r); }
.ev.L.cur *[stroke]:not([stroke="none"]) { stroke: var(--hand-l); }
.ev.L.cur *[fill]:not([fill="none"]) { fill: var(--hand-l); }
.ev.hit *[stroke]:not([stroke="none"]) { stroke: var(--ok); }
.ev.hit *[fill]:not([fill="none"]) { fill: var(--ok); }
.ev.miss *[stroke]:not([stroke="none"]) { stroke: var(--bad); }
.ev.miss *[fill]:not([fill="none"]) { fill: var(--bad); }
.scan { display: block; margin: 0 auto; max-width: none; user-select: none; }
.scan-tools { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; padding: 6px; justify-content: flex-end; pointer-events: none; }
.scan-tools > * { pointer-events: auto; box-shadow: var(--shadow); }
.empty { display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); gap: 12px; min-height: 100%; }
.empty b { color: var(--ink); font: 600 18px var(--f-title); }

.panel { display: flex; flex-direction: column; gap: 8px; }
.status { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.status .big { font: 700 20px/1.1 var(--f-ui); font-variant-numeric: tabular-nums; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .big .r { color: var(--hand-r); } .status .big .l { color: var(--hand-l); }
.status .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.status .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; transition: background .1s, transform .1s; }
.status .dot.beat { background: var(--accent); transform: scale(1.25); }
.status.good { border-color: var(--ok); } .status.badx { border-color: var(--bad); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface2); gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 0 12px; min-height: 36px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.seg button.r[aria-pressed="true"] { color: var(--hand-r); } .seg button.l[aria-pressed="true"] { color: var(--hand-l); }
.step { display: inline-flex; align-items: center; gap: 2px; border-radius: 12px; background: var(--surface2); padding: 3px; }
.step button { width: 34px; height: 36px; border: 0; border-radius: 9px; background: transparent; font-size: 18px; font-weight: 700; }
.step button:hover { background: var(--surface); }
.step output { min-width: 52px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; }
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.toggle svg { width: 18px; height: 18px; }
.meter { width: 44px; height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .06s; }

/* Klaviatur */
.kbwrap { position: relative; border-radius: 14px; background: var(--surface2); padding: 6px 6px 8px; border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.kb { position: relative; overflow-x: auto; overflow-y: hidden; height: clamp(120px, 22vh, 180px); scrollbar-width: thin; border-radius: 6px; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.kb-in { position: relative; height: 100%; }
.key { position: absolute; top: 0; border: 1px solid #00000040; touch-action: none; user-select: none; -webkit-user-select: none; display: flex; align-items: flex-end; justify-content: center; font-size: 10.5px; font-weight: 600; padding-bottom: 4px; }
.key.w { height: 100%; background: linear-gradient(var(--key-w), var(--key-w) 80%, var(--key-w2)); color: #5d6b78; border-radius: 0 0 6px 6px; z-index: 1; }
.key.b { height: 62%; background: linear-gradient(#2b3541, var(--key-b)); color: #cfd8e0; border-radius: 0 0 4px 4px; z-index: 2; border-color: #000; }
.key.w.tR { background: color-mix(in srgb, var(--hand-r) 55%, var(--key-w)); color: #fff; }
.key.w.tL { background: color-mix(in srgb, var(--hand-l) 60%, var(--key-w)); color: #fff; }
.key.b.tR { background: var(--hand-r); } .key.b.tL { background: var(--hand-l); }
.key.down { filter: brightness(.86); transform: translateY(1px); }
.key.ok { background: var(--ok) !important; } .key.bad { background: var(--bad) !important; }
.key .lbl { pointer-events: none; }
.kbnav { position: absolute; top: 50%; z-index: 5; width: 28px; height: 44px; margin-top: -22px; border: 0; border-radius: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); box-shadow: var(--shadow); font-size: 16px; }
.kbnav.l { left: 2px; } .kbnav.r { right: 2px; }

/* Bearbeiten */
.form { display: flex; flex-direction: column; gap: 14px; padding-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.card h2 { margin: 0; font: 600 17px var(--f-title); }
.card p, .hint { margin: 0; color: var(--muted); font-size: 13.5px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
input[type="text"], textarea, select { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
textarea.abc { font: 13px/1.5 var(--f-mono); min-height: 240px; resize: vertical; white-space: pre; overflow: auto; tab-size: 2; }
.scans { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.scanitem { flex: none; width: 112px; display: flex; flex-direction: column; gap: 6px; }
.scanitem .im { height: 140px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2) center/cover no-repeat; }
.scanitem .acts { display: flex; gap: 4px; }
.scanitem .acts .btn { flex: 1; padding: 0 6px; }
.issues { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow: auto; }
.issue { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--hand-l) 14%, transparent); border: 0; text-align: left; }
.issue.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.preview { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); overflow: auto; max-height: 420px; padding: 4px; color: var(--ink); }
.stream { font: 12px/1.45 var(--f-mono); white-space: pre-wrap; max-height: 160px; overflow: auto; background: var(--bg); border-radius: 10px; padding: 8px 10px; border: 1px dashed var(--line); }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details pre { font: 12px/1.5 var(--f-mono); background: var(--bg); border-radius: 10px; padding: 10px; overflow: auto; margin: 6px 0 0; }

/* Dialoge */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 20, .5); display: flex; align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.sheetbox { width: min(520px, 100%); max-height: 88%; overflow: auto; background: var(--surface); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); }
.sheetbox h2 { margin: 0; font: 600 21px var(--f-title); }
.sheetbox .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.result-n { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result-n div { background: var(--surface2); border-radius: 12px; padding: 10px; text-align: center; }
.result-n b { display: block; font: 700 24px var(--f-ui); font-variant-numeric: tabular-nums; }
.result-n span { font-size: 12px; color: var(--muted); }
.sl { display: flex; align-items: center; gap: 10px; }
.sl input[type="range"] { flex: 1; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: 90%; text-align: center; }

@media (min-width: 900px) and (min-height: 640px) {
  .panes.split { flex-direction: row; }
  .panes.split .pane + .pane { border-top: 0; border-left: 2px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .cursor, .status .dot { transition: none; } }
.piece .meta { padding-right: 78px; }

.sl output { min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

/* ===== Tasto 2 ===== */
html { overscroll-behavior: none; }
button, .key, .seg, .tab { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.key { touch-action: none; -webkit-touch-callout: none; }
.ibtn.sm { width: 34px; height: 34px; border-radius: 10px; color: var(--muted); }
.ibtn.sm svg { width: 18px; height: 18px; }
.status .sub { margin-left: auto; }
.ctrl { display: flex; flex-direction: column; gap: 8px; }
.logo { flex: none; border-radius: 23%; overflow: hidden; box-shadow: 0 2px 8px rgba(10, 20, 40, .25); }
.logo svg { display: block; width: 100%; height: 100%; }
.lib-top { display: flex; align-items: center; gap: 4px; padding-top: 4px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font: 600 26px/1 var(--f-title); letter-spacing: -.02em; }
.brand.big { font-size: 22px; flex: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.stat b { font: 700 19px/1.15 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 12px; color: var(--muted); }
.stat svg { width: 18px; height: 18px; color: var(--muted); }
.stat.hot svg { color: #f08a1c; fill: #f08a1c33; }
.resume { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 18px; border: 0; color: #fff; background: linear-gradient(120deg, #1b3358, #0f1d33 60%, #3a2a12); box-shadow: var(--shadow); }
.resume > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.resume .k { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #ffc56b; font-weight: 700; }
.resume b { font: 600 20px/1.2 var(--f-title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume .s { font-size: 12.5px; color: #c9d5e4; }
.resume svg { width: 34px; height: 34px; padding: 8px; border-radius: 50%; background: #ffae3d; color: #1b2433; flex: none; }
.lib-head h2 { margin: 0; font: 600 19px var(--f-title); }
.lib-head { align-items: center; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.menu-item > div { display: flex; flex-direction: column; } .menu-item span { font-size: 12.5px; color: var(--muted); }
.menu-item svg { color: var(--accent); flex: none; }
.intro-list { display: flex; flex-direction: column; gap: 12px; }
.intro-item { display: flex; gap: 12px; align-items: flex-start; }
.intro-item svg { flex: none; width: 36px; height: 36px; padding: 8px; border-radius: 10px; background: var(--surface2); color: var(--accent); }
.intro-item div { display: flex; flex-direction: column; gap: 2px; } .intro-item span { color: var(--muted); font-size: 13.5px; }
.flow { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surface2); }
.flow .btn.done { border-color: var(--ok); color: var(--ok); }
.sgroup { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.sgroup + .sgroup { border-top: 1px solid var(--line); padding-top: 14px; }
.sgroup h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meter.big { width: 100%; height: 12px; border-radius: 6px; }
.heard { font: 700 34px/1.2 var(--f-ui); text-align: center; min-height: 44px; font-variant-numeric: tabular-nums; }
.pane.falls { overflow: hidden; background: var(--falls-bg); }
.falls-cv { position: absolute; inset: 0; display: block; }
.kbwrap[data-size="s"] .kb { height: clamp(100px, 17vh, 140px); }
.kbwrap[data-size="l"] .kb { height: clamp(150px, 27vh, 230px); }
@media (max-height: 560px) { .view { gap: 6px; padding-block: 6px; } .kb { height: clamp(90px, 26vh, 140px); } .lib-top { padding-top: 0; } }

@media (orientation: landscape) and (max-height: 520px) {

            for (var i = 1; i < ds.length; i++) if (ds[i] - ds[i - 1] === 1) { c.padR = Math.max(c.padR, 1.1); }
          }
        });
      });
      cols.sort(function (a, b) { return a.t - b.t; });
      if (!cols.length) cols.push({ t: m.start, evs: {}, padL: 0, padR: 0, x: 0 });
      var x = 1.4 + cols[0].padL;
      cols[0].x = x;
      for (var i = 1; i < cols.length; i++) {
        x += spaceFor(cols[i - 1].dt = cols[i].t - cols[i - 1].t) + cols[i - 1].padR + cols[i].padL;

    /* 2. Zeilenumbruch */
    var x0 = nSt === 2 ? 1.9 : 0.6, x1 = W / ss - 0.6, avail = x1 - x0;

    var systems = [], cur = { ms: [], w: 0, hdr: hdrFirst };
    M.forEach(function (mm, i) {
      if (cur.ms.length && cur.hdr + cur.w + mm.nat > avail) { systems.push(cur); cur = { ms: [], w: 0, hdr: hdrOther }; }
      cur.ms.push(i); cur.w += mm.nat;

    systems.push(cur);
    systems.forEach(function (sy, k) {
      var f = (avail - sy.hdr) / sy.w;

    });

    /* 3. Vertikale Aufteilung */
    var cursorY = 1.2, out = [], sysInfo = [], colX = {}, measInfo = [];
    var tiePairs = [];
    systems.forEach(function (sy, si) {
      var ext = { R: { mn: 99, mx: 0 }, L: { mn: 99, mx: 0 } };
      sy.ms.forEach(function (mi) {
        staffs.forEach(function (s) {
          (byBar[s][M[mi].m.n] || []).forEach(function (ev) {
            if (ev.rest) return;
            ev.pitches.forEach(function (p) { var d = p.oct * 7 + p.step; ext[s].mn = Math.min(ext[s].mn, d); ext[s].mx = Math.max(ext[s].mx, d); });
          });
        });
      });
      var ty = {}, y = cursorY, bottom;
      if (nSt === 2) {
        var aboveR = Math.max(3.2, (ext.R.mx - 38) * 0.5 + 3.0);
        var belowR = Math.max(0, (30 - Math.min(ext.R.mn, 30)) * 0.5) + 1.2;
        var aboveL = Math.max(0, (Math.max(ext.L.mx, 26) - 26) * 0.5) + 1.2;
        var belowL = Math.max(3.0, (18 - Math.min(ext.L.mn, 18)) * 0.5 + 3.0);
        ty.R = y + aboveR; var gap = Math.max(6.0, belowR + aboveL + 1.2);
        ty.L = ty.R + 4 + gap; bottom = ty.L + 4 + belowL;
        sy.top = y; sy.bot = bottom;
      } else {
        var s0 = staffs[0], st0 = STAFF[s0];
        var up = Math.max(3.2, (ext[s0].mx - st0.topD) * 0.5 + 3.0);
        var dn = Math.max(3.0, (st0.bottomD - Math.min(ext[s0].mn, st0.bottomD)) * 0.5 + 3.0);
        ty[s0] = y + up; bottom = ty[s0] + 4 + dn; sy.top = y; sy.bot = bottom;
      }
      sy.ty = ty;
      cursorY = bottom + 2.4;
      var firstTy = ty[staffs[0]], lastTy = ty[staffs[nSt - 1]];
      var P = [];
      // Trefferflächen der Takte
      var mx = x0 + sy.hdr;
      sy.ms.forEach(function (mi) {
        var w = M[mi].nat * sy.f, mn = M[mi].m.n;
        P.push('<rect class="mhit" data-m="' + mn + '" x="' + r2(mx) + '" y="' + r2(sy.top) + '" width="' + r2(w) + '" height="' + r2(sy.bot - sy.top) + '" fill="#000" fill-opacity="0"/>');
        measInfo.push({ n: mn, sys: si, x: mx, w: w });
        mx += w;
      });
      // Notenlinien (letztes, nicht gestrecktes System endet am Schlussstrich)
      var xl = x1;
      if (si === systems.length - 1 && sy.f * sy.w < avail - sy.hdr - 0.01) xl = mx + 0.2;
      staffs.forEach(function (s) {
        var d = '';
        for (var l = 0; l < 5; l++) d += 'M' + r2(x0) + ' ' + r2(ty[s] + l) + 'H' + r2(xl);
        P.push('<path d="' + d + '" stroke="' + ink + '" stroke-opacity="0.6" stroke-width="0.1" fill="none"/>');
      });
      P.push('<path d="M' + r2(x0) + ' ' + r2(firstTy) + 'V' + r2(lastTy + 4) + '" stroke="' + ink + '" stroke-width="0.14" fill="none"/>');
      if (nSt === 2) {
        var h = lastTy + 4 - firstTy, bx = x0 - 0.15;
        P.push('<path d="M' + r2(bx) + ' ' + r2(firstTy) + 'C' + r2(bx - 1.5) + ' ' + r2(firstTy + h * 0.2) + ' ' + r2(bx - 1.5) + ' ' + r2(firstTy + h * 0.4) + ' ' + r2(bx - 0.6) + ' ' + r2(firstTy + h * 0.5) + 'C' + r2(bx - 1.5) + ' ' + r2(firstTy + h * 0.6) + ' ' + r2(bx - 1.5) + ' ' + r2(firstTy + h * 0.8) + ' ' + r2(bx) + ' ' + r2(lastTy + 4) + '" stroke="' + ink + '" stroke-width="0.34" fill="none" stroke-linecap="round"/>');
      }
      // Schlüssel, Vorzeichen, Takt
      staffs.forEach(function (s) {
        var st = STAFF[s], yOf = function (d) { return ty[s] + (st.topD - d) * 0.5; };
        P.push(s === 'R' ? trebleClef(x0 + 1.4, yOf(st.clefD), ink) : bassClef(x0 + 1.5, yOf(st.clefD), ink));
        var arr = sig > 0 ? st.sharpsD : st.flatsD;
        for (var i = 0; i < Math.abs(sig); i++) P.push(accGlyph(sig > 0 ? 1 : -1, x0 + 3.9 + i * 1.0, yOf(arr[i]), ink));
        if (si === 0) {
          var tx = x0 + 3.7 + keyW + 1.0;
          var fs = 'font-family="Georgia,\'Times New Roman\',serif" font-weight="700" font-size="2.7" text-anchor="middle" fill="' + ink + '"';
          P.push('<text x="' + r2(tx) + '" y="' + r2(ty[s] + 1.95) + '" ' + fs + '>' + score.meter.num + '</text>');
          P.push('<text x="' + r2(tx) + '" y="' + r2(ty[s] + 3.95) + '" ' + fs + '>' + score.meter.den + '</text>');
        }
      });
      if (si > 0) P.push('<text x="' + r2(x0 + sy.hdr - 0.2) + '" y="' + r2(firstTy - 1.0) + '" font-size="1.5" font-family="system-ui,sans-serif" fill="' + ink + '" fill-opacity="0.6">' + M[sy.ms[0]].m.n + '</text>');

      /* 4. Takte zeichnen */
      var mxx = x0 + sy.hdr;
      sy.ms.forEach(function (mi, mIdx) {
        var mm = M[mi], m = mm.m, f = sy.f;
        mm.cols.forEach(function (c) { c.ax = mxx + c.x * f; colX[c.t] = { x: c.ax, sys: si }; });
        staffs.forEach(function (s) {
          var st = STAFF[s], tys = ty[s];
          var yOf = function (d) { return tys + (st.topD - d) * 0.5; };
          var items = [];
          mm.cols.forEach(function (c) {
            (c.evs[s] || []).forEach(function (ev) {
              if (ev.rest) {
                var rx = ev.full ? mxx + (mm.nat * f) / 2 : c.ax;
                P.push('<g class="ev ' + s + '" data-e="' + ev.id + '">' + restGlyph(ev.full ? 1 : ev.val, rx, tys, ink, ev.full) + '</g>');
                if (ev.dots && !ev.full) P.push('<circle cx="' + r2(c.ax + 1.0) + '" cy="' + r2(tys + 1.5) + '" r="0.2" fill="' + ink + '"/>');

              }
              items.push(prepNote(ev, c.ax, st, tys, yOf, beat, m));
            });
          });
          applyBeams(items, st, ink, P, tiePairs);

      var evs = score.staves[s].events;

  }

  /* ---- Noten ---- */
  function prepNote(ev, x, st, tys, yOf, beat, m) {
    var ps = ev.pitches.slice().sort(function (a, b) { return (a.oct * 7 + a.step) - (b.oct * 7 + b.step) || a.midi - b.midi; });
    var ds = ps.map(function (p) { return p.oct * 7 + p.step; });
    var mn = ds[0], mx = ds[ds.length - 1];
    var it = { ev: ev, x: x, ps: ps, ds: ds, mn: mn, mx: mx, dir: ((mn + mx) / 2 >= st.midD) ? 'down' : 'up', yOf: yOf, beamIdx: Math.floor((ev.t - m.start + m.offset) / beat), heads: [] };
    return it;
  }
  function layoutHeads(it, st) {
    var n = it.ps.length, disp = new Array(n).fill(false), i;
    if (it.dir === 'up') { for (i = 1; i < n; i++) disp[i] = (it.ds[i] - it.ds[i - 1] === 1) && !disp[i - 1]; }
    else { for (i = n - 2; i >= 0; i--) disp[i] = (it.ds[i + 1] - it.ds[i] === 1) && !disp[i + 1]; }
    it.heads = it.ps.map(function (p, k) {
      var hx = it.x + (disp[k] ? (it.dir === 'up' ? 1.16 : -1.16) : 0);
      return { p: p, d: it.ds[k], x: hx, y: it.yOf(it.ds[k]), disp: disp[k] };
    });

    if (it.dir === 'up') { it.yStart = yLow; it.yEnd = Math.min(yHigh - 3.4, midY); it.anchor = yHigh; }
    else { it.yStart = yHigh; it.yEnd = Math.max(yLow + 3.4, midY); it.anchor = yLow; }
  }

  function applyBeams(items, st, ink, P, tiePairs) {
    // Richtung und Köpfe
    var groups = [], curG = null;
    items.forEach(function (it, i) {
      var ev = it.ev, prev = items[i - 1];
      var ok = ev.val >= 8 && !ev.rest;
      if (ok && curG && prev && prev.ev.val >= 8 && prev.beamIdx === it.beamIdx && prev.ev.t + prev.ev.dur === ev.t) curG.push(it);
      else { curG = ok ? [it] : null; if (curG) groups.push(curG); }
    });
    var inGroup = new Set();
    groups.forEach(function (g) {
      if (g.length < 2) return;
      var sum = 0;
      g.forEach(function (it) { sum += (it.mn + it.mx) / 2 - st.midD; });
      var dir = sum >= 0 ? 'down' : 'up';
      g.forEach(function (it) { it.dir = dir; });
    });
    items.forEach(function (it) { layoutHeads(it, st); });
    groups.forEach(function (g) {
      if (g.length < 2) return;
      g.forEach(function (it) { inGroup.add(it); it.beamed = true; });
      var up = g[0].dir === 'up', sg = up ? 1 : -1;
      var a = g[0], b = g[g.length - 1];
      var xa = a.stemX, xb = b.stemX;
      var y1 = a.anchor + (up ? -3.4 : 3.4), yN = b.anchor + (up ? -3.4 : 3.4);
      var s = Math.max(-1.5, Math.min(1.5, yN - y1)), c = (y1 + yN) / 2;
      y1 = c - s / 2; yN = c + s / 2;
      var line = function (x) { return xb === xa ? y1 : y1 + (yN - y1) * (x - xa) / (xb - xa); };
      var shift = 0;
      g.forEach(function (it) {
        var need = up ? (line(it.stemX) - (it.anchor - 2.9)) : ((it.anchor + 2.9) - line(it.stemX));
        if (need > shift) shift = need;
      });
      y1 += up ? -shift : shift; yN += up ? -shift : shift;
      g.forEach(function (it) { it.yEnd = line(it.stemX); });
      var poly = function (off, xs, xe) {
        var ya = line(xs) + off * sg, yb = line(xe) + off * sg, th = 0.5 * sg;
        return '<path class="bm" d="M' + r2(xs) + ' ' + r2(ya) + 'L' + r2(xe) + ' ' + r2(yb) + 'L' + r2(xe) + ' ' + r2(yb + th) + 'L' + r2(xs) + ' ' + r2(ya + th) + 'Z" fill="' + ink + '"/>';
      };
      P.push(poly(0, xa - (up ? 0.05 : 0.05), xb + 0.05));
      [16, 32].forEach(function (lim, li) {
        var off = 0.8 * (li + 1), i = 0;
        while (i < g.length) {

          var j = i; while (j + 1 < g.length && g[j + 1].ev.val >= lim) j++;

            var toRight = i < g.length - 1;
            var xs = toRight ? g[i].stemX : g[i].stemX - 1.1, xe = toRight ? g[i].stemX + 1.1 : g[i].stemX;
            P.push(poly(off, xs, xe));
          }
          i = j + 1;
        }
      });
    });
  }

  function drawTuplets(items, ink, P) {
    var byId = {};
    items.forEach(function (it) { if (it.ev.tup) (byId[it.ev.tup.id] = byId[it.ev.tup.id] || []).push(it); });
    Object.keys(byId).forEach(function (k) {
      var g = byId[k], a = g[0], b = g[g.length - 1], up = a.dir === 'up';
      var xm = (a.stemX + b.stemX) / 2, y;
      if (up) { y = Math.min.apply(null, g.map(function (it) { return Math.min(it.yEnd, it.anchor - 1.2); })) - 0.9; }
      else { y = Math.max.apply(null, g.map(function (it) { return Math.max(it.yEnd, it.anchor + 1.2); })) + 1.9; }
      P.push('<text x="' + r2(xm) + '" y="' + r2(y) + '" font-size="1.7" font-style="italic" font-family="Georgia,serif" text-anchor="middle" fill="' + ink + '">' + a.ev.tup.p + '</text>');
    });
  }

  function drawNote(it, st, ink, tys, si) {
    var ev = it.ev, s = '<g class="ev ' + ev.staff + '" data-e="' + ev.id + '">';
    var up = it.dir === 'up';
    // Hilfslinien
    var minHX = Math.min.apply(null, it.heads.map(function (h) { return h.x; })), maxHX = Math.max.apply(null, it.heads.map(function (h) { return h.x; }));
    var led = '';
    var lo = it.mn, hi = it.mx, dd;
    for (dd = st.bottomD - 2; dd >= lo; dd -= 2) led += 'M' + r2(minHX - 1.0) + ' ' + r2(it.yOf(dd)) + 'H' + r2(maxHX + 1.0);
    for (dd = st.topD + 2; dd <= hi; dd += 2) led += 'M' + r2(minHX - 1.0) + ' ' + r2(it.yOf(dd)) + 'H' + r2(maxHX + 1.0);

    // Vorzeichen

      var h = it.heads[i];
      if (!h.p.show) continue;
      var col = 0;
      while (cols[col] != null && cols[col] - h.d < 6) col++;
      cols[col] = h.d;
      var kind = h.p.alter;
      s += accGlyph(kind, leftX - 0.45 - col * 1.1, h.y, ink);
    }
    // Köpfe
    var open = ev.val <= 2, whole = ev.val === 1;
    it.heads.forEach(function (h) {
      if (whole) s += '<ellipse class="nh" cx="' + r2(h.x) + '" cy="' + r2(h.y) + '" rx="0.72" ry="0.46" fill="none" stroke="' + ink + '" stroke-width="0.26"/>';
      else if (open) s += '<ellipse class="nh" cx="' + r2(h.x) + '" cy="' + r2(h.y) + '" rx="0.6" ry="0.4" transform="rotate(-24 ' + r2(h.x) + ' ' + r2(h.y) + ')" fill="none" stroke="' + ink + '" stroke-width="0.17"/>';
      else s += '<ellipse class="nh" cx="' + r2(h.x) + '" cy="' + r2(h.y) + '" rx="0.62" ry="0.42" transform="rotate(-24 ' + r2(h.x) + ' ' + r2(h.y) + ')" fill="' + ink + '"/>';
      h.p._x = h.x; h.p._y = h.y; h.p._dir = it.dir; h.p._sys = si;
    });
    // Punkte
    if (ev.dots) {
      var dx = maxHX + 1.0;
      it.heads.forEach(function (h) {
        var dy = (h.d % 2 === 0) ? h.y - 0.5 : h.y;
        for (var k = 0; k < ev.dots; k++) s += '<circle class="dt" cx="' + r2(dx + k * 0.55) + '" cy="' + r2(dy) + '" r="0.2" fill="' + ink + '"/>';
      });
    }
    // Hals und Fähnchen
    if (ev.val >= 2) {
      s += '<path class="st" d="M' + r2(it.stemX) + ' ' + r2(it.yStart) + 'V' + r2(it.yEnd) + '" stroke="' + ink + '" stroke-width="0.13" fill="none"/>';
      if (ev.val >= 8 && !it.beamed) {

          if (up) s += '<path class="fl" d="M' + r2(it.stemX) + ' ' + r2(fy) + 'C' + r2(it.stemX + 0.2) + ' ' + r2(fy + 0.9) + ' ' + r2(it.stemX + 1.35) + ' ' + r2(fy + 1.3) + ' ' + r2(it.stemX + 1.0) + ' ' + r2(fy + 2.7) + 'C' + r2(it.stemX + 1.1) + ' ' + r2(fy + 1.7) + ' ' + r2(it.stemX + 0.3) + ' ' + r2(fy + 1.4) + ' ' + r2(it.stemX) + ' ' + r2(fy + 1.2) + 'Z" fill="' + ink + '"/>';
          else s += '<path class="fl" d="M' + r2(it.stemX) + ' ' + r2(fy) + 'C' + r2(it.stemX + 0.2) + ' ' + r2(fy - 0.9) + ' ' + r2(it.stemX + 1.35) + ' ' + r2(fy - 1.3) + ' ' + r2(it.stemX + 1.0) + ' ' + r2(fy - 2.7) + 'C' + r2(it.stemX + 1.1) + ' ' + r2(fy - 1.7) + ' ' + r2(it.stemX + 0.3) + ' ' + r2(fy - 1.4) + ' ' + r2(it.stemX) + ' ' + r2(fy - 1.2) + 'Z" fill="' + ink + '"/>';
        }
      }
    }
    return s + '</g>';
  }

  function barline(x, kind, yTop, yBot, staffs, ty, ink) {
    var L = function (xx, w) { return '<path d="M' + r2(xx) + ' ' + r2(yTop) + 'V' + r2(yBot) + '" stroke="' + ink + '" stroke-width="' + w + '" fill="none"/>'; };
    var dots = function (xx) {
      var d = '';
      staffs.forEach(function (s) { d += '<circle cx="' + r2(xx) + '" cy="' + r2(ty[s] + 1.5) + '" r="0.2" fill="' + ink + '"/><circle cx="' + r2(xx) + '" cy="' + r2(ty[s] + 2.5) + '" r="0.2" fill="' + ink + '"/>'; });
      return d;
    };

        sel.addEventListener('change', function () { S[key] = sel.value; saveSettings(); if (onchg) onchg(); });
        return el('label', { class: 'f' }, [label, sel]);
      }
      function group(title, kids) { return el('div', { class: 'sgroup' }, [el('h3', { text: title })].concat(kids)); }
      var re = function () { if (onChange) onChange(); };
      box.appendChild(group('Klang', [
        slider('Lautstärke', 'vol', 0.2, 1, 0.05, function (v) { return Math.round(v * 100) + ' %'; }, function () { Snd.setVol(S.vol); }),
        slider('Metronom', 'clickVol', 0.1, 1, 0.1, function (v) { return Math.round(v * 100) + ' %'; }),
        check('Ton beim Tippen auf die Klaviatur', 'tapSound'),
        check('Andere Hand spielt mit, wenn du eine Hand übst', 'accomp'),
        check('Tempo-Trainer: in der Schleife automatisch schneller', 'trainer')
      ]));
      box.appendChild(group('Ansicht', [
        select('Klaviatur', 'kbSize', [['fit', 'ganz sichtbar (passt sich an)'], ['m', 'mittel, zum Wischen'], ['l', 'groß, zum Wischen']], re),
        select('Tastenbeschriftung', 'labels', [['c', 'nur C'], ['all', 'alle Töne'], ['off', 'aus']], re),
        slider('Wasserfall-Tempo', 'pps', 80, 320, 10, function (v) { return v < 130 ? 'ruhig' : v < 220 ? 'mittel' : 'schnell'; })
      ]));
      box.appendChild(group('Mikrofon', [
        slider('Empfindlichkeit', 'sens', -10, 15, 1, function (v) { return (v > 0 ? '+' : '') + v + ' dB'; }),
        slider('Stimmung A4', 'a4', 430, 450, 1, function (v) { return v + ' Hz'; }),
        el('button', { class: 'btn', onclick: function () { close(); micTest(); } }, [icon('mic'), 'Mikrofon testen']),
        el('p', { class: 'hint', text: 'Stell das Handy neben das Klavier, nicht darauf. Im Modus „Mikro“ sind Tastenton, Begleitung und Metronom stumm, damit Tasto nur dich hört.' })
      ]));
      if (!ENV.artifact) {
        var key = el('input', { type: 'password', placeholder: 'sk-ant-…', autocomplete: 'off', value: S.apiKey || '', 'aria-label': 'API-Schlüssel' });
        key.addEventListener('change', function () { S.apiKey = key.value.trim(); saveSettings(); });
        box.appendChild(group('Noten-Erkennung', [
          el('p', { class: 'hint', text: 'Ohne Schlüssel erkennst du Noten über die Claude-App (kopieren und einfügen). Mit einem eigenen Anthropic-API-Schlüssel geht es direkt per Tipp. Den Schlüssel bekommst du auf console.anthropic.com. Er bleibt nur auf diesem Gerät, jede Erkennung kostet ein paar Cent.' }),
          el('label', { class: 'f' }, ['API-Schlüssel', key]),
          select('Modell', 'apiModel', [['claude-sonnet-5-5', 'Claude Sonnet 5.5 (schnell)'], ['claude-opus-5-5', 'Claude Opus 5.5 (genauer)']])
        ]));
      }
      box.appendChild(el('div', { class: 'acts' }, [el('button', { class: 'btn primary', text: 'Fertig', onclick: close })]));
    });
  }
  function micTest() {
    var mt = new Mic();
    overlay(function (box, close) {
      box.appendChild(el('h2', { text: 'Mikrofon-Test' }));
      box.appendChild(el('p', { class: 'hint', text: 'Spiel einzelne Töne und Akkorde auf deinem Klavier. Hier siehst du, was Tasto hört.' }));
      var bar = el('i'), lvl = el('div', { class: 'meter big', 'aria-hidden': 'true' }, [bar]);
      var notes = el('div', { class: 'heard', 'aria-live': 'polite', text: '…' }), dbo = el('div', { class: 'hint', text: '' });
      box.appendChild(lvl); box.appendChild(notes); box.appendChild(dbo);
      box.appendChild(el('div', { class: 'acts' }, [el('button', { class: 'btn primary', text: 'Fertig', onclick: close })]));
      var hold = 0;
      mt.monitor(function (picks) {
        if (picks.length) { hold = perf(); notes.textContent = picks.map(function (p) { return PC.midiLabel(p.midi); }).join(' + '); }
        else if (perf() - hold > 1.2) notes.textContent = '–';
      }, function (lv, db) {
        bar.style.width = Math.round(lv * 100) + '%';
        dbo.textContent = db < -60 ? 'Sehr leise. Rück näher ans Klavier oder erhöhe die Empfindlichkeit.' : db > -12 ? 'Sehr laut. Weiter weg stellen.' : 'Pegel gut.';
      }).catch(function () {
        notes.textContent = 'Kein Zugriff';
        dbo.textContent = ENV.artifact ? 'Innerhalb von Claude ist das Mikrofon gesperrt. In der installierten Tasto-App klappt es.' : 'Erlaube den Mikrofonzugriff und versuche es erneut.';
      });
    }, function () { mt.stop(); });
  }

  /* ================= Start ================= */
  Store.open().then(seedSamples).then(showLibrary).catch(function () { showLibrary(); });
  document.addEventListener('visibilitychange', function () { /* Audio pausiert der Browser selbst */ });
})();

</script>
