<style>
/* Tasto – Gestaltung: Mitternachtsblau, Bernstein, Elfenbein */
:root {
  --bg: #f4f2ee; --surface: #ffffff; --surface2: #eeebe5; --ink: #131824; --muted: #697182; --line: #e2ddd3;
  --accent: #1c3d70; --accent-ink: #ffffff; --brand: #f0a030; --brand-ink: #1b1206;
  --hand-r: #2f86e8; --hand-l: #ec6f3f; --ok: #1fae74; --bad: #e0455a;
  --key-w: #fcfcfa; --key-w2: #e2dfd8; --key-b: #15181f; --cursor: rgba(47, 134, 232, .14);
  --shadow: 0 1px 2px rgba(20, 24, 36, .06), 0 8px 24px rgba(20, 24, 36, .07);
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-title: "Fraunces", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f1a; --surface: #121a29; --surface2: #1a2437; --ink: #edf1f7; --muted: #8f9bb1; --line: #243049;
    --accent: #ffb547; --accent-ink: #1b1206; --brand: #ffb547; --brand-ink: #1b1206;
    --hand-r: #5aaaff; --hand-l: #ff8a5c; --ok: #3ddc97; --bad: #ff5d6c;
    --key-w: #eef0f3; --key-w2: #c3c9d2; --key-b: #0a0d12; --cursor: rgba(90, 170, 255, .18);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f1a; --surface: #121a29; --surface2: #1a2437; --ink: #edf1f7; --muted: #8f9bb1; --line: #243049;
  --accent: #ffb547; --accent-ink: #1b1206; --brand: #ffb547; --brand-ink: #1b1206;
  --hand-r: #5aaaff; --hand-l: #ff8a5c; --ok: #3ddc97; --bad: #ff5d6c;
  --key-w: #eef0f3; --key-w2: #c3c9d2; --key-b: #0a0d12; --cursor: rgba(90, 170, 255, .18);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-ui); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { flex: none; }

#app { height: max(600px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))); display: flex; flex-direction: column; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1100px; margin: 0 auto; }
body.stage-on { background: #070b14; }
body.stage-on #app { padding-left: 0; padding-right: 0; max-width: none; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-block: 12px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 600; white-space: nowrap; transition: transform .08s, background .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
.btn.big { min-height: 54px; font-size: 17px; border-radius: 16px; }
.btn svg { width: 18px; height: 18px; }
.ibtn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); }
.ibtn:active { background: var(--surface2); }
.bar { display: flex; align-items: center; gap: 8px; min-height: 46px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; font: 600 21px/1.15 var(--f-title); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Bibliothek */
.logo { flex: none; border-radius: 23%; overflow: hidden; box-shadow: 0 4px 14px rgba(15, 29, 51, .28); }
.logo svg { display: block; width: 100%; height: 100%; }
.lib-top { display: flex; align-items: center; gap: 2px; padding-top: 6px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; font: 600 28px/1 var(--f-title); letter-spacing: -.02em; }
.brand.big { font-size: 23px; flex: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.stat b { font: 700 20px/1.15 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 12px; color: var(--muted); }
.stat svg { width: 18px; height: 18px; color: var(--muted); }
.stat.hot svg { color: #f08a1c; fill: #f08a1c33; }
.resume { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 18px; border-radius: 22px; border: 0; color: #fff; background: radial-gradient(120% 140% at 100% 0%, #3b2a10 0%, rgba(59, 42, 16, 0) 55%), linear-gradient(135deg, #17305a, #0b1426 70%); box-shadow: 0 10px 30px rgba(11, 20, 38, .35); }
.resume > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.resume .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #ffc56b; font-weight: 700; }
.resume b { font: 600 22px/1.2 var(--f-title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume .s { font-size: 13px; color: #c7d3e4; }
.resume svg { width: 46px; height: 46px; padding: 13px; border-radius: 50%; background: #ffb547; color: #1b1206; flex: none; box-shadow: 0 0 0 6px rgba(255, 181, 71, .15); }
.lib-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lib-head h2 { margin: 0; font: 600 20px var(--f-title); }
.pieces { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); padding-bottom: 24px; }
.piece { display: flex; gap: 14px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); text-align: left; width: 100%; box-shadow: var(--shadow); }
.thumb { width: 62px; height: 78px; flex: none; border-radius: 10px; background: linear-gradient(160deg, #1b3358, #0b1426); overflow: hidden; display: grid; place-items: center; color: #ffc56b; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb svg { width: 26px; height: 26px; }
.piece .meta { min-width: 0; flex: 1; padding-right: 78px; }
.piece .t { font: 600 17.5px/1.2 var(--f-title); overflow-wrap: anywhere; }
.piece .s { color: var(--muted); font-size: 13px; margin-top: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.chip.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--hand-l) 16%, transparent); color: var(--hand-l); }
.empty { display: grid; place-items: center; text-align: center; padding: 28px; color: var(--muted); gap: 10px; }
.empty b { color: var(--ink); font: 600 18px var(--f-title); }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.menu-item > div { display: flex; flex-direction: column; } .menu-item span { font-size: 12.5px; color: var(--muted); }
.menu-item svg { color: var(--brand); }
.intro-list { display: flex; flex-direction: column; gap: 14px; }
.intro-item { display: flex; gap: 12px; align-items: flex-start; }
.intro-item svg { width: 38px; height: 38px; padding: 9px; border-radius: 12px; background: var(--surface2); color: var(--brand); }
.intro-item div { display: flex; flex-direction: column; gap: 2px; } .intro-item span { color: var(--muted); font-size: 13.5px; }

/* Bearbeiten */
.form { display: flex; flex-direction: column; gap: 14px; padding-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.card h2 { margin: 0; font: 600 18px var(--f-title); }
.card.ai { background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, #ffb547, #2f86e8) border-box; border: 1.5px solid transparent; }
.card p, .hint { margin: 0; color: var(--muted); font-size: 13.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
textarea.abc { font: 13px/1.5 var(--f-mono); min-height: 220px; resize: vertical; white-space: pre; overflow: auto; tab-size: 2; }
.scans { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.scanitem { flex: none; width: 112px; display: flex; flex-direction: column; gap: 6px; }
.scanitem .im { height: 140px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2) center/cover no-repeat; }
.scanitem .acts { display: flex; gap: 4px; }
.scanitem .acts .btn { flex: 1; padding: 0 6px; }
.issues { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow: auto; }
.issue { font-size: 13px; padding: 7px 11px; border-radius: 10px; background: color-mix(in srgb, var(--hand-l) 13%, transparent); border: 0; text-align: left; }
.issue.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); }
.preview { border: 1px solid var(--line); border-radius: 14px; background: #fbf9f4; color: #141821; overflow: auto; max-height: 460px; padding: 8px; }
.prevhead { justify-content: space-between; padding: 2px 4px 6px; }
.preview .seg { background: #ece8df; } .preview .seg button[aria-pressed="true"] { background: #fff; color: #141821; }
.stream { font: 12px/1.45 var(--f-mono); white-space: pre-wrap; max-height: 160px; overflow: auto; background: var(--bg); border-radius: 10px; padding: 8px 10px; border: 1px dashed var(--line); }
.pwrap { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.pmsg { font-size: 13.5px; font-weight: 600; }
.pbar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb547, #2f86e8); transition: width .4s; }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
details pre { font: 12px/1.5 var(--f-mono); background: var(--bg); border-radius: 10px; padding: 10px; overflow: auto; margin: 6px 0 0; }
.flow { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surface2); }
.flow .btn.done { border-color: var(--ok); color: var(--ok); }

/* Bedienelemente */
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface2); gap: 2px; max-width: 100%; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 0 12px; min-height: 36px; font-weight: 600; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.seg button.r[aria-pressed="true"] { color: var(--hand-r); } .seg button.l[aria-pressed="true"] { color: var(--hand-l); }
.step { display: inline-flex; align-items: center; gap: 2px; border-radius: 12px; background: var(--surface2); padding: 3px; }
.step button { width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; font-size: 18px; font-weight: 700; }
.step output { min-width: 52px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; }
.toggle[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); }
.toggle svg { width: 18px; height: 18px; }
.meter { width: 44px; height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .06s; }
.meter.big { width: 100%; height: 12px; border-radius: 6px; }
.heard { font: 700 34px/1.2 var(--f-ui); text-align: center; min-height: 44px; font-variant-numeric: tabular-nums; }
.sl { display: flex; align-items: center; gap: 10px; }
.sl input[type="range"] { flex: 1; accent-color: var(--brand); }
.sl output { min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }
.sgroup { display: flex; flex-direction: column; gap: 10px; }
.sgroup + .sgroup { border-top: 1px solid var(--line); padding-top: 14px; }
.sgroup h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Notenbild */
.pane { position: relative; overflow: auto; -webkit-overflow-scrolling: touch; }
.score-wrap { position: relative; color: #151a24; }
.score-wrap svg { display: block; }
.cursor { position: absolute; left: 0; top: 0; pointer-events: none; background: rgba(47, 134, 232, .14); border-radius: 6px; transition: transform .12s ease-out, height .12s; will-change: transform; }
.mhit.loop { fill: #f0a030; fill-opacity: .14; }
.mhit.miss { fill: #e0455a; fill-opacity: .1; }
.ev.R.cur *[stroke]:not([stroke="none"]) { stroke: #2f86e8; } .ev.R.cur *[fill]:not([fill="none"]) { fill: #2f86e8; }
.ev.L.cur *[stroke]:not([stroke="none"]) { stroke: #ec6f3f; } .ev.L.cur *[fill]:not([fill="none"]) { fill: #ec6f3f; }
.ev.hit *[stroke]:not([stroke="none"]) { stroke: #1fae74; } .ev.hit *[fill]:not([fill="none"]) { fill: #1fae74; }
.ev.miss *[stroke]:not([stroke="none"]) { stroke: #e0455a; } .ev.miss *[fill]:not([fill="none"]) { fill: #e0455a; }
.scan { display: block; margin: 0 auto; max-width: none; user-select: none; }
.scan-tools { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; padding: 6px; justify-content: flex-end; pointer-events: none; }
.scan-tools > * { pointer-events: auto; box-shadow: var(--shadow); }

/* Klaviatur (allgemein) */
.kbwrap { position: relative; }
.kb { position: relative; overflow-x: auto; overflow-y: hidden; height: clamp(120px, 22vh, 190px); scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.kb::-webkit-scrollbar { display: none; }
.kb-in { position: relative; height: 100%; }
.key { position: absolute; top: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; align-items: flex-end; justify-content: center; font-size: 10.5px; font-weight: 700; padding-bottom: 7px; transition: background .08s, transform .05s; }
.key.w { height: 100%; background: linear-gradient(180deg, #e9e7e2 0, #fdfdfb 7%, #fbfaf7 88%, #e7e4dd 100%); color: #8a8f99; border-left: 1px solid #b9b6ae; border-radius: 0 0 6px 6px; z-index: 1; box-shadow: inset 0 -5px 0 #d9d5cd, inset 0 -6px 0 #c9c4ba; }
.key.b { height: 62%; background: linear-gradient(180deg, #2d323c, #0c0e13 90%); color: #cfd8e0; border-radius: 0 0 5px 5px; z-index: 2; box-shadow: inset 0 -4px 0 #2a2f39, inset 1px 0 0 rgba(255, 255, 255, .08), 0 3px 4px rgba(0, 0, 0, .35); }
.key.w.tR { background: linear-gradient(180deg, #7cc0ff, #3a8ff0); color: #fff; box-shadow: inset 0 -5px 0 #2a72c8, 0 0 18px rgba(90, 170, 255, .45); }
.key.w.tL { background: linear-gradient(180deg, #ffb08a, #f0663a); color: #fff; box-shadow: inset 0 -5px 0 #c9502a, 0 0 18px rgba(255, 138, 92, .45); }
.key.b.tR { background: linear-gradient(180deg, #5aaaff, #1f64c0); box-shadow: 0 0 16px rgba(90, 170, 255, .6); }
.key.b.tL { background: linear-gradient(180deg, #ff9a70, #c94c22); box-shadow: 0 0 16px rgba(255, 138, 92, .6); }
.key.down { transform: translateY(2px); filter: brightness(.9); }
.key.ok { background: linear-gradient(180deg, #7bf0b8, #1fb877) !important; }
.key.bad { background: linear-gradient(180deg, #ff9aa5, #e2445a) !important; }
.key .lbl { pointer-events: none; }
.kbwrap.narrow .key .lbl { display: none; }
.kbnav { position: absolute; top: 34%; z-index: 5; width: 30px; height: 44px; border: 0; border-radius: 10px; background: rgba(10, 15, 26, .7); color: #fff; font-size: 18px; }
.kbnav.l { left: 4px; } .kbnav.r { right: 4px; }

/* ===== Bühne ===== */
.stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: #070b14; color: #e9eef6; overflow: hidden; }
.st-hud { position: relative; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); background: #0b1220; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.st-icon { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .06); color: #e9eef6; transition: background .15s, transform .15s; }
.st-icon[aria-pressed="true"] { background: rgba(255, 181, 71, .18); color: #ffc56b; }
.st-icon.open svg { transform: rotate(180deg); }
.st-icon svg { transition: transform .2s; }
.st-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 2px 6px; border: 0; background: transparent; color: inherit; text-align: left; }
.st-title b { max-width: 100%; font: 600 17px/1.15 var(--f-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-title .lvl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #ffc56b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.st-play { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: #ffb547; color: #1b1206; box-shadow: 0 0 0 5px rgba(255, 181, 71, .14); }
.st-play svg { width: 20px; height: 20px; }
.st-play.stop { background: #ff5d6c; color: #fff; box-shadow: 0 0 0 5px rgba(255, 93, 108, .16); }
.st-mic { display: inline-flex; align-items: center; gap: 3px; height: 30px; padding: 0 8px; border-radius: 99px; background: rgba(61, 220, 151, .14); color: #3ddc97; }
.st-mic svg { width: 16px; height: 16px; }
.st-mic i { display: block; width: 4px; height: 16px; border-radius: 2px; background: #3ddc97; transform-origin: bottom; transform: scaleY(.15); transition: transform .06s; }
.st-drawer { position: absolute; z-index: 7; top: 58px; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); max-height: calc(100% - 70px); overflow: auto; padding: 16px; border-radius: 20px; background: rgba(18, 26, 42, .97); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 20px 50px rgba(0, 0, 0, .55); animation: drop .18s ease-out; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.dgrid { display: grid; gap: 12px; }
.drow { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 10px; }
.dl { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8f9bb1; }
.loopout { font-weight: 700; margin-right: 4px; }

  /* ---- Noten ---- */
  function prepNote(ev, x, st, tys, yOf, beat, m) {

  function applyBeams(items, st, ink, P, tiePairs) {

  function drawTuplets(items, ink, P) {

  function drawNote(it, st, ink, tys, si) {

        if (!data || data.app !== 'tasto' || !Array.isArray(data.pieces)) throw new Error('format');
        var chain = Promise.resolve(), n = 0;
        data.pieces.forEach(function (p) {
          p.scans = (p.scans || []).map(function (sc) { return { id: sc.id, name: sc.name, blob: dataURLToBlob(sc.data) }; });
          chain = chain.then(function () { n++; return Store.put(p); });
        });
        if (data.days) Object.keys(data.days).forEach(function (k) { Days[k] = Math.max(Days[k] || 0, data.days[k] || 0); });

        return chain.then(function () { toast(n + (n === 1 ? ' Stück' : ' Stücke') + ' übernommen'); showLibrary(); });
      }).catch(function () { toast('Diese Datei ist keine Tasto-Sicherung.', 3500); });

        else if (!r.warnings.length) issues.appendChild(el('div', { class: 'issue ok', text: r.score.measures.length + ' Takte gelesen, alle Taktlängen stimmen.' }));

          issues.appendChild(el('button', { class: 'issue', text: (w.line ? 'Zeile ' + w.line + ': ' : '') + w.msg, onclick: function () { if (w.line) jumpToLine(w.line); } }));
        });
        fixBtn.hidden = !(scans.length && r.warnings.length);
        fixBtn.dataset.issues = JSON.stringify(r.warnings.map(function (w) { return w.msg; }));
        if (r.ok) {
          preview.hidden = false; clear(preview);
          var w = Math.max(280, (preview.clientWidth || scrollBox.clientWidth || 340) - 12);

          preview.appendChild(el('div', { class: 'row prevhead' }, [el('b', { text: 'Vorschau' }), lv]));

          var holder = el('div', { class: 'score-wrap' }); holder.innerHTML = L.svg; preview.appendChild(holder);
        } else preview.hidden = true;
      }
      function jumpToLine(n) {
        var lines = abcBox.value.split('\n'), pos = 0, i;
        for (i = 0; i < n - 1 && i < lines.length; i++) pos += lines[i].length + 1;
        abcBox.focus(); try { abcBox.setSelectionRange(pos, pos + (lines[n - 1] || '').length); } catch (e) { /* ignorieren */ }
      }
      var deb = null;
      abcBox.addEventListener('input', function () { clearTimeout(deb); deb = setTimeout(refresh, 300); });

      function drawScans() {
        clear(scanList);

        });
      }
      function addFiles(files) {
        var list = Array.prototype.slice.call(files || []); if (!list.length) return;

        list.forEach(function (f) {

          var m = e && (e.code === 'cancelled' || e.name === 'AbortError') ? 'Abgebrochen.' : e && e.code === 'bad_key' ? 'Der API-Schlüssel wurde abgelehnt.' : e && e.code === 'not_granted' ? 'Du hast Claude für diese App nicht freigegeben.' : e && e.code === 'rate_limited' ? 'Gerade zu viele Anfragen. Versuch es gleich nochmal.' : 'Die Erkennung ist fehlgeschlagen' + (e && e.code ? ' (' + e.code + ')' : '') + '.';

      scrollBox.appendChild(el('div', { class: 'card' }, [el('h2', { text: 'Notentext' }),
        el('p', { text: 'Rechte Hand unter „V:R“, linke Hand unter „V:L“. Die Vorschau aktualisiert sich beim Tippen.' }), abcBox, issues, fixBtn, preview, help]));

  /* ================= Ansicht: Üben (Bühne) ================= */
  function beatTicks(m) { if (m.den === 8) return m.num % 3 === 0 ? 720 : 480; if (m.den === 2) return 960; return 480; }
  var LEVELS = [['easy', 'Leicht'], ['mid', 'Mittel'], ['orig', 'Original']];
  function levelName(l) { for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i][0] === l) return LEVELS[i][1]; return 'Original'; }

  function showPractice(id) {

        [['Nochmal', function () { restart(); }], ['Im Takt spielen', function () { setMode('play'); }, true]]);
    }
    function resultBox(title, nums, hint, acts, extra) {
      overlay(function (box, close) {
        box.classList.add('result');
        box.appendChild(el('h2', { text: title }));
        if (extra) box.appendChild(extra);
        box.appendChild(el('div', { class: 'result-n' }, nums.map(function (n) { return el('div', {}, [el('b', { text: n[0] }), el('span', { text: n[1] })]); })));
        box.appendChild(el('p', { class: 'hint', text: hint }));
        box.appendChild(el('div', { class: 'acts' }, acts.map(function (a) { return el('button', { class: 'btn' + (a[2] ? ' primary' : ''), text: a[0], onclick: function () { close(); a[1](); } }); })));
      });
    }
    /* Im Takt */
    function startPlay() {
      stopAll(); Snd.resume(); toggleDrawer(false);
      var r = loopRange(), s0 = st.steps[r[0]]; if (!s0) return;
      var m = score.meter, bt = beatTicks(m), beatSec = bt * spt(), nBeats = Math.max(1, Math.round(m.ticks / bt));
      var lead = 0.3, t0 = perf() + lead + nBeats * beatSec, a0 = Snd.now() + lead;
      var p = { a: r[0], b: r[1], cur: r[0], done: {}, got: {}, miss: {}, win: clamp(beatSec * 0.4, 0.2, 0.42), beatSec: beatSec, nBeats: nBeats, perf0: perf() + lead, audio0: a0, tStart: s0.t, t0: t0,
        due: function (j) { return t0 + (st.steps[j].t - s0.t) * spt(); }, clicks: 0, accIdx: 0, bus: null, acc: [] };
      var endT = st.steps[r[1]].t + st.steps[r[1]].dur;
      p.totalBeats = nBeats + Math.ceil((endT - s0.t) / bt);
      if (S.accomp && st.hands !== 'RL' && st.input !== 'mic') { p.acc = accEvents().filter(function (e) { return e.t >= s0.t && e.t < endT; }); p.bus = Snd.bus(); }
      p.audioT0 = a0 + nBeats * beatSec;
      st.play = p; st.stats = { hit: 0, miss: 0, wrong: 0, loops: 0 }; notation.clearMarks();
      showStep(r[0], true);
      p.timer = setInterval(tickPlay, 20);
      renderGo(); updateStatus();
    }
    function tickPlay() {
      var p = st.play; if (!p) return;
      var now = perf(), an = Snd.now();
      while (p.clicks < p.totalBeats && p.perf0 + p.clicks * p.beatSec < now + 0.3) {
        var k = p.clicks, audible = (k < p.nBeats || st.metro) && st.input !== 'mic';
        if (audible) Snd.click(p.audio0 + k * p.beatSec, k % p.nBeats === 0);
        (function (kk) { setTimeout(function () { if (!st.play) return; if (kk < p.nBeats) { big.hidden = false; big.textContent = String(p.nBeats - kk); big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop'); } else big.hidden = true; }, Math.max(0, (p.perf0 + kk * p.beatSec - perf()) * 1000)); })(k);
        p.clicks++;
      }
      while (p.accIdx < p.acc.length && p.audioT0 + (p.acc[p.accIdx].t - p.tStart) * spt() < an + 0.6) {
        var ae = p.acc[p.accIdx++]; Snd.play(ae.midi, p.audioT0 + (ae.t - p.tStart) * spt(), Math.max(0.15, ae.dur * spt() * 0.95), 0.55, p.bus);
      }
      while (p.cur <= p.b && now > p.due(p.cur) + p.win) { if (!p.done[p.cur]) markMiss(p.cur); p.cur++; }
      if (p.cur > p.b) return finishPlay();
      if (st.i !== p.cur && now > p.due(p.cur) - p.beatSec * 0.9) showStep(p.cur);
    }
    function markMiss(j) {
      var s = st.steps[j]; st.stats.miss++;
      notation.mark(s.evIds, 'miss'); notation.markBar(s.bar);
      st.play.miss[s.bar] = (st.play.miss[s.bar] || 0) + 1;
    }
    function playNote(m, t) {
      var p = st.play, best = null;
      if (t < p.due(p.a) - p.win) return;
      for (var j = p.cur; j <= Math.min(p.b, p.cur + 2); j++) {
        if (p.done[j]) continue;
        var d = Math.abs(t - p.due(j));
        if (d <= p.win && st.steps[j].notes.some(function (n) { return n.midi === m; }) && (!best || d < best.d)) best = { j: j, d: d };
      }
      if (best) {
        var g = p.got[best.j] = p.got[best.j] || {}; g[m] = 1; kb.flash(m, 'ok'); falls.burst(m, 'ok');
        if (Object.keys(g).length >= st.steps[best.j].notes.length - (st.input === 'mic' && st.steps[best.j].notes.length >= 3 ? 1 : 0)) {
          if (!p.done[best.j]) { p.done[best.j] = true; st.stats.hit++; notation.mark(st.steps[best.j].evIds, 'hit'); flashPill('good'); }
        }
      } else { st.stats.wrong++; kb.flash(m, 'bad'); falls.burst(m, 'bad'); flashPill('bad'); }
    }
    function finishPlay() {
      var p = st.play; stopAll();
      var tot = p.b - p.a + 1, pct = Math.round(100 * st.stats.hit / tot);
      var bars = Object.keys(p.miss).map(Number).sort(function (a, b) { return a - b; });
      var full = p.a === 0 && p.b === st.steps.length - 1;
      recordResult(pct, p.miss, full);
      if (st.loop) {
        var msg = 'Durchgang ' + pct + ' %';
        if (S.trainer) {
          if (pct >= 90 && st.pct < 100) { setPct(st.pct + 5); msg += ' · schneller: ' + st.pct + ' %'; }
          else if (pct < 60 && st.pct > 40) { setPct(st.pct - 5); msg += ' · langsamer: ' + st.pct + ' %'; }
          else if (pct >= 90) msg += ' · sitzt!';
        }
        toast(msg, 1800);
        setTimeout(function () { if (st.mode === 'play' && !st.play && root.contains(stage)) startPlay(); }, 900);
        return;
      }
      var worst = bars.slice().sort(function (a, b) { return p.miss[b] - p.miss[a]; })[0];
      var acts = [];
      if (bars.length) acts.push(['Stelle üben', function () { var a = bars[0], b = bars[bars.length - 1]; if (b - a > 3) { a = worst; b = Math.min(worst + 1, score.measures.length); } setLoop({ a: a, b: b }); toast('Schleife Takt ' + a + '–' + b, 2400); }]);
      if (pct < 70 && st.level !== 'easy') acts.push(['Leichter spielen', function () { setLevel(st.level === 'orig' ? 'mid' : 'easy'); }]);
      acts.push(['Nochmal', function () { startPlay(); }, true]);
      var badge = full && st.hands === 'RL' && piece.stats.best === pct ? el('span', { class: 'chip ok', style: 'align-self:flex-start', text: 'Neuer Bestwert' }) : null;
      resultBox(pct >= 90 ? 'Stark gespielt!' : pct >= 60 ? 'Gut, noch etwas Feinschliff' : 'Langsamer üben lohnt sich', [[pct + ' %', 'Treffer'], [String(st.stats.miss), 'verpasst'], [String(st.stats.wrong), 'falsche Töne']],
        bars.length ? 'Schwierig waren die Takte ' + bars.join(', ') + '.' : 'Kein Takt ist durchgefallen.', acts, badge);
    }
    function recordResult(pct, missBars, full) {
      var ps = piece.stats; ps.bars = ps.bars || {};
      Object.keys(missBars).forEach(function (b) { ps.bars[b] = (ps.bars[b] || 0) + missBars[b]; });
      if (full && st.hands === 'RL' && st.level === 'orig' && (ps.best == null || pct > ps.best)) { ps.best = pct; ps.bestPct = st.pct; }
      if (full) { ps.levelBest = ps.levelBest || {}; if (!(ps.levelBest[st.level] >= pct)) ps.levelBest[st.level] = pct; }
      persist();
    }
    /* Hören */
    function startDemo(fromStep) {
      stopAll(); Snd.resume(); toggleDrawer(false);
      var r = loopRange(), from = fromStep != null ? fromStep : r[0], s0 = st.steps[from]; if (!s0 || !Snd.ctx()) return;
      var last = st.steps[r[1]], tEnd = last.t + last.dur, events = PC.soundEvents(score).filter(function (e) { return e.t >= s0.t && e.t < tEnd; });
      var d = { bus: Snd.bus(), base: Snd.now() + 0.25, idx: 0, events: events, tStart: s0.t, tEnd: tEnd, restartFrom: from, active: {}, range: r, lastStep: -1 };
      st.demo = d;
      d.timer = setInterval(function () {
        var sp = spt(), now = Snd.now();
        while (d.idx < d.events.length && d.base + (d.events[d.idx].t - d.tStart) * sp < now + 1.0) {
          var e = d.events[d.idx++];
          Snd.play(e.midi, d.base + (e.t - d.tStart) * sp, Math.max(0.12, e.dur * sp * 0.96), st.hands.indexOf(e.hand) < 0 ? 0.38 : 0.85, d.bus);
        }
        var tick = d.tStart + (now - d.base) / sp;
        if (tick >= d.tEnd) { if (st.loop) { d.base = now + 0.15; d.idx = 0; return; } return stopAll(); }
        var k = d.lastStep < 0 ? from : d.lastStep;
        while (k + 1 <= d.range[1] && st.steps[k + 1].t <= tick) k++;
        if (k !== d.lastStep && tick >= s0.t - 1) { d.lastStep = k; showStep(k); }
        var ds = {};
        for (var q = Math.max(0, d.idx - 24); q < d.idx; q++) { var ev = d.events[q]; if (ev.t <= tick && tick < ev.t + ev.dur * 0.96) ds[ev.midi] = 1; }
        Object.keys(d.active).forEach(function (mm) { if (!ds[mm]) { kb.setDown(+mm, false); delete d.active[mm]; } });
        Object.keys(ds).forEach(function (mm) { if (!d.active[mm]) { kb.setDown(+mm, true); d.active[mm] = 1; } });
      }, 30);
      renderGo(); updateStatus();
    }
    function onGo() {
      if (st.mode === 'play') { if (st.play) { stopAll(); restart(); } else startPlay(); }
      else if (st.mode === 'demo') { if (st.demo) stopAll(); else startDemo(st.i < loopRange()[0] || st.i > loopRange()[1] ? null : st.i); }
    }
    function stopAll() {
      if (st.play) { clearInterval(st.play.timer); Snd.killBus(st.play.bus); st.play = null; }
      if (st.demo) { clearInterval(st.demo.timer); Snd.killBus(st.demo.bus); Object.keys(st.demo.active).forEach(function (m) { kb.setDown(+m, false); }); st.demo = null; }
      Object.keys(held).forEach(function (m) { if (held[m]) { held[m].release(); held[m] = null; } });
      big.hidden = true; renderGo(); updateStatus();
    }
    function restart() {
      stopAll(); st.done = false; st.got = {}; st.gotT = 0;
      st.stats = { hit: 0, miss: 0, wrong: 0, loops: 0 }; notation.clearMarks();
      st.i = loopRange()[0]; showStep(st.i);
    }
    var _acc = null, _accH = null;
    function accEvents() { if (_accH !== st.hands + st.level) { _accH = st.hands + st.level; _acc = PC.soundEvents(score).filter(function (e) { return st.hands.indexOf(e.hand) < 0; }); } return _acc; }
    function accompany(t0, t1) {
      if (!S.accomp || st.hands === 'RL' || st.input === 'mic') return;
      var c = Snd.resume(); if (!c) return;
      var b0 = Snd.now() + 0.02, sp = spt();
      accEvents().forEach(function (e) { if (e.t >= t0 && e.t < t1) Snd.play(e.midi, b0 + (e.t - t0) * sp, Math.max(0.15, e.dur * sp * 0.95), 0.55); });
    }
    cleanup = function () {
      window.removeEventListener('resize', onResize); stopAll(); stopInput(); falls.stop(); clearInterval(practiceTimer); Wake.off(); persist(); saveDays();
      document.body.classList.remove('stage-on');
    };
  }
  function showScans(piece) {
    overlay(function (box, close) {
      box.classList.add('scanbox');
      var pane = el('div', { class: 'pane' }); box.appendChild(pane);
      var sv = new ScanView(pane, piece.scans);
      box.appendChild(el('div', { class: 'acts' }, [el('button', { class: 'btn primary', text: 'Schließen', onclick: close })]));
      box._sv = sv;
    }, function () { /* URLs werden beim nächsten Öffnen neu erstellt */ });
  }

  /* ================= Einstellungen ================= */
  function openSettings(onChange) {
    overlay(function (box, close) {
      box.appendChild(el('h2', { text: 'Einstellungen' }));
      function slider(label, key, min, max, step, fmt, onchg) {
        var out = el('output', { text: fmt(S[key]) });
        var inp = el('input', { type: 'range', min: min, max: max, step: step, value: S[key], 'aria-label': label });
        inp.addEventListener('input', function () { S[key] = +inp.value; out.textContent = fmt(S[key]); saveSettings(); if (onchg) onchg(); });
        return el('label', { class: 'f' }, [label, el('div', { class: 'sl' }, [inp, out])]);
      }
      function check(label, key, onchg) {
        var id = 'set-' + key, c = el('input', { type: 'checkbox', id: id }); c.checked = !!S[key];
        c.addEventListener('change', function () { S[key] = c.checked; saveSettings(); if (onchg) onchg(); });
        return el('label', { class: 'toggle', for: id }, [c, label]);
      }
      function select(label, key, opts, onchg) {
        var sel = el('select', { 'aria-label': label }, opts.map(function (o) { return el('option', { value: o[0], text: o[1] }); }));
        sel.value = S[key];
        sel.addEventListener('change', function () { S[key] = sel.value; saveSettings(); if (onchg) onchg(); });
        return el('label', { class: 'f' }, [label, sel]);
      }
      function group(title, kids) { return el('div', { class: 'sgroup' }, [el('h3', { text: title })].concat(kids)); }
      var re = function () { if (onChange) onChange(); };
      box.appendChild(group('Klang', [
        slider('Lautstärke', 'vol', 0.2, 1, 0.05, function (v) { return Math.round(v * 100) + ' %'; }, function () { Snd.setVol(S.vol); }),
        slider('Metronom', 'clickVol', 0.1, 1, 0.1, function (v) { return Math.round(v * 100) + ' %'; }),
        check('Ton beim Tippen auf die Klaviatur', 'tapSound'),
        check('Andere Hand spielt mit, wenn du eine Hand übst', 'accomp'),
        check('Tempo-Trainer: in der Schleife automatisch schneller', 'trainer')
      ]));
      box.appendChild(group('Ansicht', [
        select('Klaviatur', 'kbSize', [['fit', 'ganz sichtbar (passt sich an)'], ['m', 'mittel, zum Wischen'], ['l', 'groß, zum Wischen']], re),
        select('Tastenbeschriftung', 'labels', [['c', 'nur C'], ['all', 'alle Töne'], ['off', 'aus']], re),
        slider('Wasserfall-Tempo', 'pps', 80, 320, 10, function (v) { return v < 130 ? 'ruhig' : v < 220 ? 'mittel' : 'schnell'; })
      ]));
      box.appendChild(group('Mikrofon', [
        slider('Empfindlichkeit', 'sens', -10, 15, 1, function (v) { return (v > 0 ? '+' : '') + v + ' dB'; }),
        slider('Stimmung A4', 'a4', 430, 450, 1, function (v) { return v + ' Hz'; }),
        el('button', { class: 'btn', onclick: function () { close(); micTest(); } }, [icon('mic'), 'Mikrofon testen']),
        el('p', { class: 'hint', text: 'Stell das Handy neben das Klavier, nicht darauf. Im Modus „Mikro“ sind Tastenton, Begleitung und Metronom stumm, damit Tasto nur dich hört.' })
      ]));
      if (!ENV.artifact) {
        var key = el('input', { type: 'password', placeholder: 'sk-ant-…', autocomplete: 'off', value: S.apiKey || '', 'aria-label': 'API-Schlüssel' });
        key.addEventListener('change', function () { S.apiKey = key.value.trim(); saveSettings(); });
        box.appendChild(group('Noten-Erkennung', [
          el('p', { class: 'hint', text: 'Ohne Schlüssel erkennst du Noten über die Claude-App (kopieren und einfügen). Mit einem eigenen Anthropic-API-Schlüssel geht es direkt per Tipp. Den Schlüssel bekommst du auf console.anthropic.com. Er bleibt nur auf diesem Gerät, jede Erkennung kostet ein paar Cent.' }),
          el('label', { class: 'f' }, ['API-Schlüssel', key]),
          select('Modell', 'apiModel', [['claude-sonnet-5-5', 'Claude Sonnet 5.5 (schnell)'], ['claude-opus-5-5', 'Claude Opus 5.5 (genauer)']])
        ]));
      }
      box.appendChild(el('div', { class: 'acts' }, [el('button', { class: 'btn primary', text: 'Fertig', onclick: close })]));
    });
  }
  function micTest() {
    var mt = new Mic();
    overlay(function (box, close) {
      box.appendChild(el('h2', { text: 'Mikrofon-Test' }));
      box.appendChild(el('p', { class: 'hint', text: 'Spiel einzelne Töne und Akkorde auf deinem Klavier. Hier siehst du, was Tasto hört.' }));
      var bar = el('i'), lvl = el('div', { class: 'meter big', 'aria-hidden': 'true' }, [bar]);
      var notes = el('div', { class: 'heard', 'aria-live': 'polite', text: '…' }), dbo = el('div', { class: 'hint', text: '' });
      box.appendChild(lvl); box.appendChild(notes); box.appendChild(dbo);
      box.appendChild(el('div', { class: 'acts' }, [el('button', { class: 'btn primary', text: 'Fertig', onclick: close })]));
      var hold = 0;
      mt.monitor(function (picks) {
        if (picks.length) { hold = perf(); notes.textContent = picks.map(function (p) { return PC.midiLabel(p.midi); }).join(' + '); }
        else if (perf() - hold > 1.2) notes.textContent = '–';
      }, function (lv, db) {
        bar.style.width = Math.round(lv * 100) + '%';
        dbo.textContent = db < -60 ? 'Sehr leise. Rück näher ans Klavier oder erhöhe die Empfindlichkeit.' : db > -12 ? 'Sehr laut. Weiter weg stellen.' : 'Pegel gut.';
      }).catch(function () {
        notes.textContent = 'Kein Zugriff';
        dbo.textContent = ENV.artifact ? 'Innerhalb von Claude ist das Mikrofon gesperrt. In der installierten Tasto-App klappt es.' : 'Erlaube den Mikrofonzugriff und versuche es erneut.';
      });
    }, function () { mt.stop(); });
  }

  /* ================= Start ================= */
  Store.open().then(seedSamples).then(showLibrary).catch(function () { showLibrary(); });
  document.addEventListener('visibilitychange', function () { /* Audio pausiert der Browser selbst */ });
})();

</script>
